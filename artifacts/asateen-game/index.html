<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>أساطير - لعبة العباقرة</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at top, #1a1a2e, #0f0c29);
            min-height: 100vh;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            padding: 20px;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية متحركة */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,215,0,0.1)"/><circle cx="80" cy="40" r="1.5" fill="rgba(255,215,0,0.08)"/><circle cx="50" cy="80" r="2.5" fill="rgba(255,215,0,0.12)"/><circle cx="90" cy="70" r="1" fill="rgba(255,215,0,0.1)"/></svg>');
            background-repeat: repeat;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* أنيميشنات */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .card {
            background: rgba(15, 25, 35, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 35px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: fadeInUp 0.5s ease-out;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF6347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
            letter-spacing: 2px;
        }

        .logo i {
            margin: 0 10px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        input, button, select {
            width: 100%;
            padding: 14px 18px;
            margin: 8px 0;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }

        input {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        input:focus {
            outline: none;
            border-color: #FFD700;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            font-weight: bold;
            color: #1a1a2e;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 25px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .player-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(-5px);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-ready {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            box-shadow: 0 0 10px rgba(56, 239, 125, 0.3);
        }

        .status-waiting {
            background: linear-gradient(135deg, #f2994a, #f2c94c);
        }

        .hidden {
            display: none;
        }

        .emojis {
            font-size: 4rem;
            text-align: center;
            margin: 25px;
            animation: pulse 1s ease-in-out infinite;
        }

        .hint {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.4));
            padding: 15px;
            border-radius: 20px;
            margin: 15px 0;
            border-right: 3px solid #FFD700;
        }

        .scores-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            gap: 20px;
        }

        .team-score {
            text-align: center;
            flex: 1;
            padding: 15px;
            border-radius: 25px;
            transition: all 0.3s;
        }

        .team-score:hover {
            transform: scale(1.02);
        }

        .team-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 2.8rem;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .flex {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .flex > * {
            flex: 1;
            min-width: 120px;
        }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1e1e2e, #2d2d44);
            color: #FFD700;
            padding: 12px 25px;
            border-radius: 50px;
            z-index: 1000;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            animation: fadeInUp 0.3s ease;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeInUp 0.3s ease;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e1e2e, #2d2d44);
            padding: 40px;
            border-radius: 40px;
            text-align: center;
            max-width: 90%;
            width: 450px;
            border: 2px solid #FFD700;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
            .flex {
                flex-direction: column;
            }
            .logo {
                font-size: 1.8rem;
            }
            .score-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- شاشة الدخول -->
    <div id="lobbyScreen" class="card">
        <div class="logo">
            <i class="fas fa-dragon"></i>
            لعبة الأساطير
            <i class="fas fa-crown"></i>
        </div>
        <input type="text" id="playerName" placeholder="✏️ اسمك">
        <div class="flex">
            <button id="showCreateBtn" class="btn-primary">
                <i class="fas fa-plus-circle"></i> إنشاء غرفة
            </button>
            <button id="showJoinBtn">
                <i class="fas fa-door-open"></i> انضمام
            </button>
        </div>
        
        <div id="createSection" class="hidden">
            <div class="flex">
                <input type="text" id="teamAName" placeholder="🏆 فريق النور" value="النور">
                <input type="color" id="teamAColor" value="#4CAF50">
            </div>
            <div class="flex">
                <input type="text" id="teamBName" placeholder="🌙 فريق الظلام" value="الظلام">
                <input type="color" id="teamBColor" value="#FF9800">
            </div>
            <button id="createRoomBtn" class="btn-primary">
                <i class="fas fa-rocket"></i> إنشاء الغرفة
            </button>
        </div>
        
        <div id="joinSection" class="hidden">
            <input type="text" id="joinRoomCode" placeholder="🔑 رمز الغرفة">
            <button id="joinRoomBtn" class="btn-primary">
                <i class="fas fa-sign-in-alt"></i> انضمام
            </button>
        </div>
    </div>

    <!-- شاشة الغرفة -->
    <div id="roomScreen" class="hidden">
        <div class="card">
            <h2 style="display: flex; justify-content: space-between; align-items: center;">
                <span>🏠 الغرفة</span>
                <span id="roomCodeDisplay" style="background: rgba(255,215,0,0.2); padding: 8px 20px; border-radius: 30px; font-size: 1.2rem;"></span>
            </h2>
            <div class="players-list" id="playersList"></div>
            <div class="flex">
                <button id="readyBtn" class="btn-primary">
                    <i class="fas fa-check-circle"></i> جاهز
                </button>
                <button id="forceStartBtn" style="background: linear-gradient(135deg, #f39c12, #e67e22);">
                    <i class="fas fa-play"></i> بدء اللعبة
                </button>
            </div>
            <div id="gameStatus" style="text-align: center; margin-top: 20px; color: #FFD700; font-size: 0.9rem;"></div>
        </div>
    </div>

    <!-- شاشة اللعب -->
    <div id="gameScreen" class="hidden">
        <div class="card">
            <div class="scores-bar" id="scoresBar"></div>
            <div id="gameContent" style="min-height: 350px;"></div>
        </div>
    </div>
</div>

<script>
    let socket = null, currentRoom = null, isCreator = false;
    let teamAName = 'النور', teamBName = 'الظلام';
    let teamAColor = '#4CAF50', teamBColor = '#FF9800';

    const lobby = document.getElementById('lobbyScreen');
    const roomScreen = document.getElementById('roomScreen');
    const gameScreen = document.getElementById('gameScreen');
    const createSection = document.getElementById('createSection');
    const joinSection = document.getElementById('joinSection');

    // Toast notification
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        toast.style.borderColor = isError ? '#f5576c' : '#FFD700';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    // Modal
    function showModal(title, message, onClose) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-content">
                <h2 style="color: #FFD700; margin-bottom: 20px;">${title}</h2>
                <p style="margin: 20px 0; line-height: 1.6;">${message}</p>
                <button onclick="this.closest('.modal-overlay').remove()" class="btn-primary" style="padding: 12px 30px;">تأكيد</button>
            </div>
        `;
        document.body.appendChild(modal);
        if (onClose) modal.onclick = () => { modal.remove(); onClose(); };
    }

    document.getElementById('showCreateBtn').onclick = () => {
        createSection.classList.toggle('hidden');
        joinSection.classList.add('hidden');
    };
    document.getElementById('showJoinBtn').onclick = () => {
        joinSection.classList.toggle('hidden');
        createSection.classList.add('hidden');
    };

    function connect() {
        socket = io();
        
        socket.on('connect', () => console.log('✅ متصل بالسيرفر'));
        
        socket.on('roomCreated', (data) => {
            currentRoom = data.roomCode;
            isCreator = true;
            showRoomScreen();
            showToast(`✅ تم إنشاء الغرفة: ${currentRoom}`);
        });
        
        socket.on('roomJoined', (data) => {
            currentRoom = data.roomCode;
            isCreator = false;
            showRoomScreen();
            showToast(`✅ انضممت إلى الغرفة: ${currentRoom}`);
        });
        
        socket.on('playersUpdate', (players) => updatePlayersList(players));
        
        socket.on('gameStarted', (data) => {
            teamAName = data.teamAName;
            teamBName = data.teamBName;
            teamAColor = data.teamAColor;
            teamBColor = data.teamBColor;
            showGameScreen();
            showToast('🎮 تبدأ اللعبة الآن! استعدوا 🎮');
        });
        
        socket.on('roundStart', (data) => {
            updateScoresBar(data.scores);
            document.getElementById('gameContent').innerHTML = `
                <div style="text-align:center;padding:50px 20px;">
                    <i class="fas fa-hourglass-half" style="font-size: 3rem; color: #FFD700; margin-bottom: 20px; display: block;"></i>
                    <h3>🎮 جولة ${data.round}/4 تبدأ...</h3>
                    <p style="margin-top: 15px; opacity: 0.7;">استعد للإجابة على الأسئلة!</p>
                </div>
            `;
        });
        
        socket.on('showQuestion', (data) => {
            showQuestion(data);
        });
        
        socket.on('answerResult', (data) => {
            const msg = `${data.team === 'teamA' ? teamAName : teamBName}: ${data.isCorrect ? '✅ صحيح' : '❌ خطأ'}`;
            showToast(msg, !data.isCorrect);
            if (!data.isCorrect) {
                showToast(`📖 الإجابة الصحيحة: ${data.correctAnswer}`, false);
            }
        });
        
        socket.on('roundEnd', (data) => {
            showRoundResult(data);
        });
        
        socket.on('gameEnd', (data) => {
            const winnerText = data.winner === 'draw' ? '🤝 تعادل!' : `🏆 الفائز: ${data.winnerName} 🏆`;
            showModal('🎊 نهاية اللعبة 🎊', 
                `${data.teamAName}: ${data.finalScores.teamA} - ${data.teamBName}: ${data.finalScores.teamB}\n\n${winnerText}`,
                () => location.reload()
            );
        });
        
        socket.on('error', (msg) => showToast(msg, true));
    }

    document.getElementById('createRoomBtn').onclick = () => {
        const name = document.getElementById('playerName').value.trim();
        if (!name) { showToast('❌ أدخل اسمك أولاً', true); return; }
        connect();
        socket.once('connect', () => {
            socket.emit('createRoom', {
                playerName: name,
                teamAName: document.getElementById('teamAName').value.trim() || 'النور',
                teamBName: document.getElementById('teamBName').value.trim() || 'الظلام',
                teamAColor: document.getElementById('teamAColor').value,
                teamBColor: document.getElementById('teamBColor').value
            });
        });
    };

    document.getElementById('joinRoomBtn').onclick = () => {
        const name = document.getElementById('playerName').value.trim();
        const code = document.getElementById('joinRoomCode').value.trim().toUpperCase();
        if (!name || !code) { showToast('❌ أدخل اسمك ورمز الغرفة', true); return; }
        connect();
        socket.once('connect', () => {
            socket.emit('checkRoom', code, (res) => {
                if (!res.exists) { showToast('❌ الغرفة غير موجودة', true); return; }
                socket.emit('joinRoom', { roomCode: code, playerName: name });
            });
        });
    };

    function showRoomScreen() {
        lobby.classList.add('hidden');
        roomScreen.classList.remove('hidden');
        document.getElementById('roomCodeDisplay').innerText = currentRoom;
        document.getElementById('readyBtn').onclick = () => {
            socket.emit('playerReady', { roomCode: currentRoom });
            document.getElementById('readyBtn').disabled = true;
            document.getElementById('readyBtn').innerHTML = '<i class="fas fa-check"></i> تم التجهيز';
            showToast('✓ تم تجهيزك، في انتظار الآخر');
        };
        document.getElementById('forceStartBtn').onclick = () => {
            socket.emit('forceStartGame', { roomCode: currentRoom });
            showToast('🎮 جاري بدء اللعبة...');
        };
    }

    function updatePlayersList(players) {
        const container = document.getElementById('playersList');
        const ready = players.filter(p => p.isReady).length;
        const total = players.length;
        document.getElementById('gameStatus').innerHTML = total === 2 && ready === 2 ? 
            '<i class="fas fa-check-circle"></i> الجميع جاهز! سيبدأ قريباً...' : 
            `<i class="fas fa-users"></i> ${ready}/2 لاعب جاهز`;
        
        container.innerHTML = players.map(p => `
            <div class="player-item">
                <span>
                    ${p.isCreator ? '<i class="fas fa-crown" style="color: #FFD700;"></i> ' : ''}
                    <i class="fas fa-user"></i> ${p.name}
                </span>
                <span class="status-badge ${p.isReady ? 'status-ready' : 'status-waiting'}">
                    <i class="fas ${p.isReady ? 'fa-check' : 'fa-clock'}"></i>
                    ${p.isReady ? 'جاهز' : 'غير جاهز'}
                </span>
            </div>
        `).join('');
    }

    function showGameScreen() {
        lobby.classList.add('hidden');
        roomScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        updateScoresBar({ teamA: 0, teamB: 0 });
    }

    function updateScoresBar(scores) {
        document.getElementById('scoresBar').innerHTML = `
            <div class="team-score" style="background: linear-gradient(135deg, ${teamAColor}20, transparent); border-bottom: 3px solid ${teamAColor};">
                <div class="team-name" style="color: ${teamAColor}">
                    <i class="fas fa-shield-alt"></i> ${teamAName}
                </div>
                <div class="score-value">${scores.teamA}</div>
            </div>
            <div class="team-score" style="background: linear-gradient(135deg, ${teamBColor}20, transparent); border-bottom: 3px solid ${teamBColor};">
                <div class="team-name" style="color: ${teamBColor}">
                    <i class="fas fa-moon"></i> ${teamBName}
                </div>
                <div class="score-value">${scores.teamB}</div>
            </div>
        `;
    }

    function showQuestion(data) {
        const content = document.getElementById('gameContent');
        if (data.type === 'ironman') {
            content.innerHTML = `
                <div style="text-align:center; animation: fadeInUp 0.3s;">
                    <div style="display: inline-block; background: rgba(255,215,0,0.1); padding: 5px 20px; border-radius: 30px; margin-bottom: 20px;">
                        <i class="fas fa-robot"></i> الرجل الحديدي - ${data.current}/${data.total}
                    </div>
                    <div class="emojis">${data.emojis}</div>
                    <div class="hint"><i class="fas fa-lightbulb"></i> ${data.hint}</div>
                    <div style="position: relative;">
                        <input type="text" id="answerInput" placeholder="✏️ اكتب الإجابة هنا..." style="padding-right: 50px;">
                        <i class="fas fa-pen" style="position: absolute; right: 15px; top: 28px; color: #FFD700;"></i>
                    </div>
                    <button onclick="submitAnswer()" class="btn-primary" style="margin-top: 15px;">
                        <i class="fas fa-paper-plane"></i> إجابة
                    </button>
                </div>
            `;
        } else {
            content.innerHTML = `
                <div style="text-align:center; animation: fadeInUp 0.3s;">
                    <div style="display: inline-block; background: rgba(255,215,0,0.1); padding: 5px 20px; border-radius: 30px; margin-bottom: 20px;">
                        <i class="fas fa-question-circle"></i> السؤال ${data.current}/${data.total}
                    </div>
                    <div style="font-size:1.6rem; margin: 25px; line-height: 1.4;">${data.question.q}</div>
                    <div style="position: relative;">
                        <input type="text" id="answerInput" placeholder="✏️ اكتب إجابتك هنا..." style="padding-right: 50px;">
                        <i class="fas fa-pen" style="position: absolute; right: 15px; top: 28px; color: #FFD700;"></i>
                    </div>
                    <button onclick="submitAnswer()" class="btn-primary" style="margin-top: 15px;">
                        <i class="fas fa-paper-plane"></i> إجابة
                    </button>
                </div>
            `;
        }
        document.getElementById('answerInput')?.focus();
    }

    window.submitAnswer = () => {
        const answer = document.getElementById('answerInput')?.value.trim();
        if (answer) {
            socket.emit('submitAnswer', { roomCode: currentRoom, answer });
            document.getElementById('gameContent').innerHTML = `
                <div style="text-align:center;padding:60px 20px;">
                    <i class="fas fa-hourglass-half" style="font-size: 3rem; color: #FFD700; margin-bottom: 20px; display: block;"></i>
                    <h3>⏳ جاري الانتظار...</h3>
                    <p style="margin-top: 15px; opacity: 0.7;">في انتظار إجابة الفريق الآخر</p>
                </div>
            `;
        } else {
            showToast('❌ اكتب إجابة أولاً', true);
        }
    };

    function showRoundResult(data) {
        const winner = data.roundScores.teamA > data.roundScores.teamB ? data.teamAName : 
                      (data.roundScores.teamB > data.roundScores.teamA ? data.teamBName : 'تعادل');
        showModal(`🎉 نهاية الجولة ${data.round} 🎉`,
            `<div style="text-align: center;">
                <div style="margin: 10px 0;"><span style="color: ${data.teamAColor}">●</span> ${data.teamAName}: <strong>${data.roundScores.teamA}</strong></div>
                <div style="margin: 10px 0;"><span style="color: ${data.teamBColor}">●</span> ${data.teamBName}: <strong>${data.roundScores.teamB}</strong></div>
                <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.1);">
                <div>🏆 فائز الجولة: <strong>${winner}</strong></div>
                <div style="margin-top: 10px; font-size: 1.1rem;">النتيجة الإجمالية: ${data.totalScores.teamA} - ${data.totalScores.teamB}</div>
            </div>`,
            () => updateScoresBar(data.totalScores)
        );
    }
</script>
</body>
</html>
