<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>أساطير - لعبة العباقرة</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 20px;
            color: white;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(45deg, #FFD700, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 30px;
        }
        input, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
        }
        input {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,215,0,0.5);
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, #FFD700, #FF8C00); font-weight: bold; }
        .players-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .player-item {
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
        }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
        .status-ready { background: #4CAF50; }
        .status-waiting { background: #FF9800; }
        .hidden { display: none; }
        .emojis { font-size: 3rem; text-align: center; margin: 20px; }
        .hint { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; margin: 10px 0; }
        .scores-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
        }
        .team-score { text-align: center; flex: 1; }
        .score-value { font-size: 2rem; font-weight: bold; }
        .flex { display: flex; gap: 15px; }
        .flex > * { flex: 1; }
        @media (max-width: 600px) { .flex { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="lobbyScreen" class="card">
        <div class="logo">⚔️ لعبة الأساطير ⚔️</div>
        <input type="text" id="playerName" placeholder="اسمك">
        <div class="flex">
            <button id="showCreateBtn" class="btn-primary">➕ إنشاء غرفة</button>
            <button id="showJoinBtn">🔗 انضمام</button>
        </div>
        <div id="createSection" class="hidden">
            <div class="flex">
                <input type="text" id="teamAName" placeholder="فريق النور" value="النور">
                <input type="color" id="teamAColor" value="#4CAF50">
            </div>
            <div class="flex">
                <input type="text" id="teamBName" placeholder="فريق الظلام" value="الظلام">
                <input type="color" id="teamBColor" value="#FF9800">
            </div>
            <button id="createRoomBtn" class="btn-primary">🚀 إنشاء</button>
        </div>
        <div id="joinSection" class="hidden">
            <input type="text" id="joinRoomCode" placeholder="رمز الغرفة">
            <button id="joinRoomBtn" class="btn-primary">🔑 انضمام</button>
        </div>
    </div>

    <div id="roomScreen" class="hidden">
        <div class="card">
            <h2>🏠 الغرفة: <span id="roomCodeDisplay"></span></h2>
            <div class="players-list" id="playersList"></div>
            <div class="flex">
                <button id="readyBtn" class="btn-primary">✓ جاهز</button>
                <button id="forceStartBtn" style="background:#f39c12;">🎮 بدء</button>
            </div>
            <div id="gameStatus" style="text-align: center; margin-top: 15px;"></div>
        </div>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="card">
            <div class="scores-bar" id="scoresBar"></div>
            <div id="gameContent"></div>
        </div>
    </div>
</div>

<script>
    let socket = null, currentRoom = null, isCreator = false;
    let teamAName = 'النور', teamBName = 'الظلام';
    let teamAColor = '#4CAF50', teamBColor = '#FF9800';

    const lobby = document.getElementById('lobbyScreen');
    const roomScreen = document.getElementById('roomScreen');
    const gameScreen = document.getElementById('gameScreen');
    const createSection = document.getElementById('createSection');
    const joinSection = document.getElementById('joinSection');

    document.getElementById('showCreateBtn').onclick = () => {
        createSection.classList.toggle('hidden');
        joinSection.classList.add('hidden');
    };
    document.getElementById('showJoinBtn').onclick = () => {
        joinSection.classList.toggle('hidden');
        createSection.classList.add('hidden');
    };

    function connect() {
        socket = io();
        
        socket.on('connect', () => console.log('✅ متصل'));
        
        socket.on('roomCreated', (data) => {
            currentRoom = data.roomCode;
            isCreator = true;
            showRoomScreen();
        });
        
        socket.on('roomJoined', (data) => {
            currentRoom = data.roomCode;
            isCreator = false;
            showRoomScreen();
        });
        
        socket.on('playersUpdate', (players) => updatePlayersList(players));
        
        socket.on('gameStarted', (data) => {
            teamAName = data.teamAName;
            teamBName = data.teamBName;
            teamAColor = data.teamAColor;
            teamBColor = data.teamBColor;
            showGameScreen();
        });
        
        socket.on('roundStart', (data) => {
            updateScoresBar(data.scores);
            document.getElementById('gameContent').innerHTML = `<div style="text-align:center;padding:20px;">🎮 جولة ${data.round}/4 تبدأ...</div>`;
        });
        
        socket.on('showQuestion', (data) => {
            showQuestion(data);
        });
        
        socket.on('answerResult', (data) => {
            const msg = `${data.team === 'teamA' ? teamAName : teamBName}: ${data.isCorrect ? '✅ صحيح' : '❌ خطأ'}`;
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:black;padding:10px;border-radius:20px;z-index:1000';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        });
        
        socket.on('roundEnd', (data) => {
            showRoundResult(data);
        });
        
        socket.on('gameEnd', (data) => {
            alert(`🎊 نهاية اللعبة 🎊\n${data.teamAName}: ${data.finalScores.teamA} - ${data.teamBName}: ${data.finalScores.teamB}\nالفائز: ${data.winnerName}`);
            location.reload();
        });
        
        socket.on('error', (msg) => alert(msg));
    }

    document.getElementById('createRoomBtn').onclick = () => {
        const name = document.getElementById('playerName').value.trim();
        if (!name) { alert('أدخل اسمك'); return; }
        connect();
        socket.once('connect', () => {
            socket.emit('createRoom', {
                playerName: name,
                teamAName: document.getElementById('teamAName').value.trim() || 'النور',
                teamBName: document.getElementById('teamBName').value.trim() || 'الظلام',
                teamAColor: document.getElementById('teamAColor').value,
                teamBColor: document.getElementById('teamBColor').value
            });
        });
    };

    document.getElementById('joinRoomBtn').onclick = () => {
        const name = document.getElementById('playerName').value.trim();
        const code = document.getElementById('joinRoomCode').value.trim().toUpperCase();
        if (!name || !code) { alert('أدخل اسمك ورمز الغرفة'); return; }
        connect();
        socket.once('connect', () => {
            socket.emit('checkRoom', code, (res) => {
                if (!res.exists) { alert('الغرفة غير موجودة'); return; }
                socket.emit('joinRoom', { roomCode: code, playerName: name });
            });
        });
    };

    function showRoomScreen() {
        lobby.classList.add('hidden');
        roomScreen.classList.remove('hidden');
        document.getElementById('roomCodeDisplay').innerText = currentRoom;
        document.getElementById('readyBtn').onclick = () => {
            socket.emit('playerReady', { roomCode: currentRoom });
            document.getElementById('readyBtn').disabled = true;
        };
        document.getElementById('forceStartBtn').onclick = () => {
            socket.emit('forceStartGame', { roomCode: currentRoom });
        };
    }

    function updatePlayersList(players) {
        const container = document.getElementById('playersList');
        const ready = players.filter(p => p.isReady).length;
        document.getElementById('gameStatus').innerHTML = `${ready}/2 لاعب جاهز`;
        container.innerHTML = players.map(p => `
            <div class="player-item">
                <span>${p.isCreator ? '👑 ' : ''}${p.name}</span>
                <span class="status-badge ${p.isReady ? 'status-ready' : 'status-waiting'}">
                    ${p.isReady ? 'جاهز' : 'غير جاهز'}
                </span>
            </div>
        `).join('');
    }

    function showGameScreen() {
        lobby.classList.add('hidden');
        roomScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        updateScoresBar({ teamA: 0, teamB: 0 });
    }

    function updateScoresBar(scores) {
        document.getElementById('scoresBar').innerHTML = `
            <div class="team-score" style="color: ${teamAColor}">
                <div>${teamAName}</div>
                <div class="score-value">${scores.teamA}</div>
            </div>
            <div class="team-score" style="color: ${teamBColor}">
                <div>${teamBName}</div>
                <div class="score-value">${scores.teamB}</div>
            </div>
        `;
    }

    function showQuestion(data) {
        const content = document.getElementById('gameContent');
        if (data.type === 'ironman') {
            content.innerHTML = `
                <div style="text-align:center">
                    <h3>🤖 ${data.current}/${data.total}</h3>
                    <div class="emojis">${data.emojis}</div>
                    <div class="hint">💡 ${data.hint}</div>
                    <input type="text" id="answerInput" placeholder="اكتب الإجابة...">
                    <button onclick="submitAnswer()" class="btn-primary">إجابة</button>
                </div>
            `;
        } else {
            content.innerHTML = `
                <div style="text-align:center">
                    <h3>📢 ${data.current}/${data.total}</h3>
                    <div style="font-size:1.5rem; margin:20px">${data.question.q}</div>
                    <input type="text" id="answerInput" placeholder="اكتب الإجابة...">
                    <button onclick="submitAnswer()" class="btn-primary">إجابة</button>
                </div>
            `;
        }
    }

    window.submitAnswer = () => {
        const answer = document.getElementById('answerInput').value.trim();
        if (answer) {
            socket.emit('submitAnswer', { roomCode: currentRoom, answer });
            document.getElementById('gameContent').innerHTML = '<div style="text-align:center;padding:20px;">⏳ جاري الانتظار...</div>';
        }
    };

    function showRoundResult(data) {
        const winner = data.roundScores.teamA > data.roundScores.teamB ? data.teamAName : (data.roundScores.teamB > data.roundScores.teamA ? data.teamBName : 'تعادل');
        alert(`🎉 نهاية الجولة ${data.round} 🎉\n${data.teamAName}: ${data.roundScores.teamA} - ${data.teamBName}: ${data.roundScores.teamB}\nفائز الجولة: ${winner}\nالنتيجة الإجمالية: ${data.totalScores.teamA} - ${data.totalScores.teamB}`);
        updateScoresBar(data.totalScores);
    }
</script>
</body>
</html>
