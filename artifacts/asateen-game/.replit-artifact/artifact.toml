kind = "web"
previewPath = "/"
title = "لعبة الأساطير"
version = "1.0.0"
id = "artifacts/asateen-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19908

[services.development]
run = "pnpm --filter @workspace/asateen-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/asateen-game", "run", "build" ]
publicDir = "artifacts/asateen-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19908"
BASE_PATH = "/"
