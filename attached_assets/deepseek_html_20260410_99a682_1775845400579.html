<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>أساطير - لعبة العباقرة</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            padding: 20px;
            color: white;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(45deg, #FFD700, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 30px;
        }
        input, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-family: inherit;
        }
        input {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,215,0,0.5);
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #FFD700, #FF8C00); font-weight: bold; }
        .players-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .player-item {
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .status-ready { background: #4CAF50; }
        .status-waiting { background: #FF9800; }
        .team-btn {
            flex: 1;
            background: rgba(255,255,255,0.2);
            margin: 5px;
        }
        .team-btn.selected { background: linear-gradient(135deg, #4CAF50, #45a049); }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .option-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
        }
        .hidden { display: none; }
        .emojis { font-size: 3rem; text-align: center; margin: 20px; }
        .hint { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; margin: 10px 0; }
        .scores { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.2rem; }
        @media (max-width: 600px) { .card { padding: 20px; } .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- شاشة الدخول -->
    <div id="lobbyScreen" class="card">
        <div class="logo">⚔️ لعبة الأساطير ⚔️</div>
        <input type="text" id="playerName" placeholder="اكتب اسمك">
        <div style="display: flex; gap: 15px; margin: 10px 0;">
            <button id="createRoomBtn" class="btn-primary" style="flex:1">➕ إنشاء غرفة</button>
            <button id="showJoinBtn" style="flex:1">🔗 انضمام لغرفة</button>
        </div>
        <div id="joinSection" class="hidden">
            <input type="text" id="joinRoomCode" placeholder="رمز الغرفة">
            <button id="joinRoomBtn" class="btn-primary">انضمام</button>
        </div>
    </div>

    <!-- شاشة الغرفة -->
    <div id="roomScreen" class="hidden">
        <div class="card">
            <h2>🏠 الغرفة: <span id="roomCodeDisplay"></span></h2>
            <div class="players-list" id="playersList"></div>
            <div style="display: flex; gap: 10px;">
                <button id="readyBtn" class="btn-primary">✓ أنا جاهز</button>
                <button id="forceStartBtn" style="background:#f39c12;">🎮 بدء اللعبة</button>
            </div>
            <div id="gameStatus" style="text-align: center; margin-top: 15px; color: #FFD700;"></div>
        </div>
    </div>

    <!-- شاشة اللعب -->
    <div id="gameScreen" class="hidden">
        <div class="card">
            <div class="scores">
                <span>🛡️ <span id="scoreA">0</span></span>
                <span>الجولة <span id="currentRound">1</span>/4</span>
                <span>🌑 <span id="scoreB">0</span></span>
            </div>
            <div id="gameContent"></div>
        </div>
    </div>
</div>

<script>
    let socket = null;
    let currentRoom = null;
    let myTeam = 'teamA';
    let isCreator = false;

    const lobbyScreen = document.getElementById('lobbyScreen');
    const roomScreen = document.getElementById('roomScreen');
    const gameScreen = document.getElementById('gameScreen');
    const joinSection = document.getElementById('joinSection');

    // الاتصال بالسيرفر
    function connect() {
        socket = io();
        
        socket.on('connect', () => console.log('متصل'));
        
        socket.on('roomCreated', (data) => {
            currentRoom = data.roomCode;
            isCreator = true;
            showRoomScreen();
        });
        
        socket.on('roomJoined', (data) => {
            currentRoom = data.roomCode;
            isCreator = false;
            showRoomScreen();
        });
        
        socket.on('playersUpdate', (players) => {
            updatePlayersList(players);
        });
        
        socket.on('gameStarted', (data) => {
            console.log('اللعبة بدأت!', data);
            showGameScreen();
        });
        
        socket.on('roundLoaded', (data) => {
            console.log('تم تحميل الجولة:', data.round);
            document.getElementById('currentRound').innerText = data.round;
            document.getElementById('scoreA').innerText = data.scores.teamA;
            document.getElementById('scoreB').innerText = data.scores.teamB;
        });
        
        socket.on('showIronManQuestion', (data) => {
            showIronManScreen(data);
        });
        
        socket.on('showSportsQuestion', (data) => {
            showNormalQuestionScreen(data, 'sports');
        });
        
        socket.on('showGamingQuestion', (data) => {
            showNormalQuestionScreen(data, 'gaming');
        });
        
        socket.on('showSeriesQuestion', (data) => {
            showNormalQuestionScreen(data, 'series');
        });
        
        socket.on('answerResult', (data) => {
            if (data.isCorrect) {
                showToast(`✅ إجابة صحيحة! +10 نقاط`);
            } else {
                showToast(`❌ إجابة خاطئة! الإجابة الصحيحة: ${data.correctAnswer || '...'}`);
            }
        });
        
        socket.on('roundEnd', (data) => {
            showToast(`🎉 نهاية الجولة ${data.round}! النتيجة: ${data.roundScores.teamA} - ${data.roundScores.teamB}`);
        });
        
        socket.on('gameEnd', (data) => {
            showGameEnd(data);
        });
        
        socket.on('error', (msg) => {
            alert(msg);
        });
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#FFD700;padding:10px 20px;border-radius:30px;z-index:1000';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    document.getElementById('createRoomBtn').onclick = () => {
        const name = document.getElementById('playerName').value.trim();
        if (!name) { alert('أدخل اسمك'); return; }
        connect();
        socket.once('connect', () => {
            socket.emit('createRoom', { playerName: name, gameMode: '1v1' });
        });
    };

    document.getElementById('showJoinBtn').onclick = () => {
        joinSection.classList.toggle('hidden');
    };

    document.getElementById('joinRoomBtn').onclick = () => {
        const name = document.getElementById('playerName').value.trim();
        const code = document.getElementById('joinRoomCode').value.trim().toUpperCase();
        if (!name || !code) { alert('أدخل اسمك ورمز الغرفة'); return; }
        connect();
        socket.once('connect', () => {
            socket.emit('checkRoom', code, (res) => {
                if (!res.exists) { alert('الغرفة غير موجودة'); return; }
                socket.emit('joinRoom', { roomCode: code, playerName: name });
            });
        });
    };

    function showRoomScreen() {
        lobbyScreen.classList.add('hidden');
        roomScreen.classList.remove('hidden');
        document.getElementById('roomCodeDisplay').innerText = currentRoom;
        
        document.getElementById('readyBtn').onclick = () => {
            socket.emit('playerReady', { roomCode: currentRoom });
            document.getElementById('readyBtn').disabled = true;
            document.getElementById('readyBtn').innerText = '✓ تم التجهيز';
        };
        
        document.getElementById('forceStartBtn').onclick = () => {
            socket.emit('forceStartGame', { roomCode: currentRoom });
        };
    }

    function updatePlayersList(players) {
        const container = document.getElementById('playersList');
        const status = document.getElementById('gameStatus');
        const readyCount = players.filter(p => p.isReady).length;
        
        status.innerHTML = `📢 ${readyCount}/${players.length} لاعب جاهز`;
        
        container.innerHTML = players.map(p => `
            <div class="player-item">
                <span>${p.isCreator ? '👑 ' : ''}${p.name}</span>
                <span class="status-badge ${p.isReady ? 'status-ready' : 'status-waiting'}">
                    ${p.isReady ? 'جاهز' : 'غير جاهز'}
                </span>
            </div>
        `).join('');
    }

    function showGameScreen() {
        lobbyScreen.classList.add('hidden');
        roomScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
    }

    function showIronManScreen(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align:center">
                <h3>🤖 الرجل الحديدي - السؤال ${data.questionNumber}/${data.totalQuestions}</h3>
                <div class="emojis">${data.emojis}</div>
                <div class="hint">💡 تلميح: ${data.hint}</div>
                <input type="text" id="ironAnswer" placeholder="اكتب اسم الشخصية...">
                <button onclick="submitIronAnswer()" class="btn-primary">إجابة</button>
            </div>
        `;
    }

    window.submitIronAnswer = () => {
        const answer = document.getElementById('ironAnswer').value.trim();
        if (answer) {
            socket.emit('submitIronManAnswer', { roomCode: currentRoom, answer });
            document.getElementById('gameContent').innerHTML = '<div style="text-align:center">⏳ جاري الانتظار...</div>';
        }
    };

    function showNormalQuestionScreen(data, type) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align:center">
                <h3>📢 السؤال ${data.questionNumber}/${data.totalQuestions}</h3>
                <div style="font-size:1.5rem; margin:20px">${data.question.q}</div>
                <div class="options-grid">
                    ${data.question.options.map((opt, idx) => `
                        <div class="option-card" onclick="submitNormalAnswer(${idx})">${opt}</div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    window.submitNormalAnswer = (idx) => {
        socket.emit('submitNormalAnswer', { roomCode: currentRoom, answerIndex: idx });
        document.getElementById('gameContent').innerHTML = '<div style="text-align:center">⏳ جاري الانتظار...</div>';
    };

    function showGameEnd(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align:center">
                <h2>🏆 نهاية اللعبة 🏆</h2>
                <h3>الفائز: ${data.winner}</h3>
                <p>النتيجة: ${data.finalScores.teamA} - ${data.finalScores.teamB}</p>
                <button onclick="location.reload()" class="btn-primary">🔄 العودة</button>
            </div>
        `;
    }
</script>
</body>
</html>
