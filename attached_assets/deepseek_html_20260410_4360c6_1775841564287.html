<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>أساطير - لعبة العباقرة</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            padding: 20px;
            color: white;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(255,215,0,0.5); }
            50% { text-shadow: 0 0 30px rgba(255,215,0,0.8); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(45deg, #FFD700, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 2s infinite;
            margin-bottom: 30px;
        }

        input, select, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-family: inherit;
        }

        input, select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,215,0,0.5);
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            font-weight: bold;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .player-item {
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .crown {
            color: #FFD700;
            font-size: 1.2rem;
        }

        .player-team {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .team-a-badge {
            background: #4CAF50;
        }

        .team-b-badge {
            background: #FF9800;
        }

        .team-none {
            background: #666;
        }

        .kick-btn {
            background: #f44336;
            padding: 5px 10px;
            width: auto;
            margin: 0;
            font-size: 0.8rem;
        }

        .team-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .team-btn {
            flex: 1;
            background: rgba(255,255,255,0.2);
        }

        .team-btn.selected {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .ready-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .settings-section {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
        }

        .settings-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            gap: 15px;
            flex-wrap: wrap;
        }

        .setting-row label {
            flex: 1;
        }

        .setting-row input, .setting-row select {
            flex: 2;
            margin: 0;
        }

        .game-area {
            min-height: 400px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .option-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        canvas {
            background: white;
            border-radius: 15px;
            cursor: crosshair;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            display: block;
        }

        .drawing-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .status-ready {
            background: #4CAF50;
        }

        .status-waiting {
            background: #FF9800;
        }

        .system-message {
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
            font-size: 0.9rem;
            border-right: 3px solid #FFD700;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .setting-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- شاشة الدخول -->
    <div id="lobbyScreen" class="card">
        <div class="logo">⚔️ لعبة الأساطير ⚔️</div>
        
        <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;">
            <button id="showCreateBtn" class="btn-primary" style="flex: 1;">➕ إنشاء غرفة جديدة</button>
            <button id="showJoinBtn" style="flex: 1;">🔗 انضمام إلى غرفة</button>
        </div>
        
        <!-- نموذج إنشاء غرفة -->
        <div id="createForm" class="hidden">
            <input type="text" id="newPlayerName" placeholder="اسمك">
            <button id="createRoomBtn" class="btn-primary">🚀 إنشاء الغرفة</button>
        </div>
        
        <!-- نموذج انضمام -->
        <div id="joinForm" class="hidden">
            <input type="text" id="joinPlayerName" placeholder="اسمك">
            <input type="text" id="joinRoomCode" placeholder="رمز الغرفة">
            <button id="joinRoomBtn" class="btn-primary">🔑 انضمام</button>
        </div>
    </div>

    <!-- شاشة الغرفة -->
    <div id="roomScreen" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h2>🏠 الغرفة: <span id="roomCodeDisplay"></span></h2>
                <button id="copyRoomBtn" style="width: auto; padding: 8px 15px;">📋 نسخ الرابط</button>
            </div>
            
            <div id="systemMessages" class="system-message hidden"></div>
            
            <div class="players-list" id="playersList"></div>
            
            <!-- إعدادات المدير (تظهر فقط للمدير) -->
            <div id="adminControls" class="hidden">
                <div class="settings-section">
                    <div class="settings-title">⚙️ إعدادات الغرفة</div>
                    <div class="setting-row">
                        <label>وضع اللعبة:</label>
                        <select id="gameModeSelect">
                            <option value="2v2">2 ضد 2</option>
                            <option value="1v1">1 ضد 1</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>نقاط الإجابة الصحيحة:</label>
                        <input type="number" id="pointsPerCorrect" value="10" min="1" max="50">
                    </div>
                    <div class="setting-row">
                        <label>نقاط الرسم والتخمين:</label>
                        <input type="number" id="drawingPoints" value="20" min="1" max="100">
                    </div>
                    <div class="setting-row">
                        <label>نقاط الأسئلة الغريبة:</label>
                        <input type="number" id="weirdPoints" value="2" min="1" max="20">
                    </div>
                    <div class="setting-row">
                        <label>نقاط كود نيمز:</label>
                        <input type="number" id="spyPoints" value="30" min="1" max="100">
                    </div>
                    <button id="saveSettingsBtn">💾 حفظ الإعدادات</button>
                    <button id="forceStartBtn" class="btn-primary" style="margin-top: 10px;">🎮 بدء اللعبة فوراً</button>
                </div>
            </div>
            
            <div class="team-buttons" id="teamSelection">
                <button class="team-btn" data-team="teamA">🛡️ فريق النور</button>
                <button class="team-btn" data-team="teamB">🌑 فريق الظلام</button>
            </div>
            
            <button id="readyBtn" class="ready-btn">✓ جاهز</button>
            <div id="gameStatus" style="text-align: center; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- شاشة اللعب -->
    <div id="gameScreen" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <div>🎮 الجولة: <span id="currentRound">1</span>/5</div>
                <div>🛡️ <span id="teamAScore">0</span> - <span id="teamBScore">0</span> 🌑</div>
            </div>
            <div id="gameContent" class="game-area"></div>
        </div>
    </div>
</div>

<script>
    let socket = null;
    let currentRoom = null;
    let myPlayerId = null;
    let myTeam = null;
    let isCreator = false;
    let currentCanvas = null;
    let isDrawing = false;

    // عناصر DOM
    const lobbyScreen = document.getElementById('lobbyScreen');
    const roomScreen = document.getElementById('roomScreen');
    const gameScreen = document.getElementById('gameScreen');
    const createForm = document.getElementById('createForm');
    const joinForm = document.getElementById('joinForm');

    // تبديل الشاشات
    document.getElementById('showCreateBtn').onclick = () => {
        createForm.classList.remove('hidden');
        joinForm.classList.add('hidden');
    };
    
    document.getElementById('showJoinBtn').onclick = () => {
        createForm.classList.add('hidden');
        joinForm.classList.remove('hidden');
    };

    // إنشاء غرفة
    document.getElementById('createRoomBtn').onclick = () => {
        const playerName = document.getElementById('newPlayerName').value.trim();
        if (!playerName) {
            alert('الرجاء إدخال اسمك');
            return;
        }
        
        const settings = {
            pointsPerCorrect: 10,
            drawingPoints: 20,
            weirdPoints: 2,
            spyPoints: 30,
            timeLimit: 30
        };
        
        connectSocket();
        socket.once('connect', () => {
            socket.emit('createRoom', { playerName, settings });
        });
    };

    // انضمام إلى غرفة
    document.getElementById('joinRoomBtn').onclick = () => {
        const playerName = document.getElementById('joinPlayerName').value.trim();
        const roomCode = document.getElementById('joinRoomCode').value.trim().toUpperCase();
        
        if (!playerName || !roomCode) {
            alert('الرجاء إدخال اسمك ورمز الغرفة');
            return;
        }
        
        connectSocket();
        socket.once('connect', () => {
            socket.emit('checkRoom', roomCode, (response) => {
                if (!response.exists) {
                    alert('الغرفة غير موجودة');
                    return;
                }
                if (response.playerCount >= 4) {
                    alert('الغرفة ممتلئة');
                    return;
                }
                socket.emit('joinRoom', { roomCode, playerName });
            });
        });
    };

    function connectSocket() {
        if (socket && socket.connected) return;
        
        socket = io();
        
        socket.on('connect', () => {
            console.log('متصل بالسيرفر');
        });
        
        socket.on('roomCreated', (data) => {
            currentRoom = data.roomCode;
            myPlayerId = data.playerId;
            isCreator = data.isCreator;
            showRoomScreen();
        });
        
        socket.on('roomJoined', (data) => {
            currentRoom = data.roomCode;
            myPlayerId = data.playerId;
            isCreator = data.isCreator;
            showRoomScreen();
        });
        
        socket.on('playersUpdate', (players) => {
            updatePlayersList(players);
        });
        
        socket.on('roomSettings', (settings) => {
            if (isCreator) {
                document.getElementById('pointsPerCorrect').value = settings.pointsPerCorrect;
                document.getElementById('drawingPoints').value = settings.drawingPoints;
                document.getElementById('weirdPoints').value = settings.weirdPoints;
                document.getElementById('spyPoints').value = settings.spyPoints;
            }
        });
        
        socket.on('systemMessage', (message) => {
            showSystemMessage(message);
        });
        
        socket.on('kicked', (message) => {
            alert(message);
            location.reload();
        });
        
        socket.on('newCreator', (newCreatorId) => {
            if (myPlayerId === newCreatorId) {
                isCreator = true;
                showSystemMessage('🔑 أنت الآن مدير الغرفة!');
                showRoomScreen();
            }
        });
        
        socket.on('gameStarted', () => {
            showGameScreen();
        });
        
        socket.on('roundLoaded', (data) => {
            document.getElementById('currentRound').innerText = data.round;
            document.getElementById('teamAScore').innerText = data.scores.teamA;
            document.getElementById('teamBScore').innerText = data.scores.teamB;
        });
        
        socket.on('showQuestion', (data) => {
            showQuestionScreen(data);
        });
        
        socket.on('teamAnswered', (data) => {
            showToast(`فريق ${data.team === 'teamA' ? 'النور' : 'الظلام'} أجاب!`);
        });
        
        socket.on('startDrawing', (data) => {
            showDrawingScreen(data);
        });
        
        socket.on('showGuesses', (data) => {
            showGuessScreen(data);
        });
        
        socket.on('guessResult', (data) => {
            if (data.team === myTeam) {
                showToast(data.isCorrect ? '✅ إجابتك صحيحة!' : `❌ خطأ! الكلمة الصحيحة: ${data.correctWord}`);
            }
        });
        
        socket.on('showWeirdQuestion', (data) => {
            showWeirdQuestionScreen(data);
        });
        
        socket.on('startSpyMaster', (data) => {
            showSpyMasterScreen(data);
        });
        
        socket.on('showSpyGuesses', (data) => {
            showSpyGuessScreen(data);
        });
        
        socket.on('roundEnd', (data) => {
            showRoundEnd(data);
        });
        
        socket.on('gameEnd', (data) => {
            showGameEnd(data);
        });
        
        socket.on('error', (message) => {
            alert(message);
        });
    }
    
    function showSystemMessage(message) {
        const msgDiv = document.getElementById('systemMessages');
        msgDiv.classList.remove('hidden');
        msgDiv.innerHTML = message;
        setTimeout(() => {
            msgDiv.classList.add('hidden');
        }, 3000);
    }
    
    function showToast(message) {
        const toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = 'rgba(0,0,0,0.9)';
        toast.style.color = '#FFD700';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '30px';
        toast.style.zIndex = '1000';
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    function showRoomScreen() {
        lobbyScreen.classList.add('hidden');
        roomScreen.classList.remove('hidden');
        gameScreen.classList.add('hidden');
        
        document.getElementById('roomCodeDisplay').innerText = currentRoom;
        
        if (isCreator) {
            document.getElementById('adminControls').classList.remove('hidden');
        } else {
            document.getElementById('adminControls').classList.add('hidden');
        }
        
        // أحداث المدير
        document.getElementById('saveSettingsBtn')?.addEventListener('click', () => {
            const settings = {
                pointsPerCorrect: parseInt(document.getElementById('pointsPerCorrect').value),
                drawingPoints: parseInt(document.getElementById('drawingPoints').value),
                weirdPoints: parseInt(document.getElementById('weirdPoints').value),
                spyPoints: parseInt(document.getElementById('spyPoints').value)
            };
            socket.emit('updateSettings', { roomCode: currentRoom, settings });
        });
        
        document.getElementById('forceStartBtn')?.addEventListener('click', () => {
            socket.emit('forceStartGame', { roomCode: currentRoom });
        });
        
        document.getElementById('gameModeSelect')?.addEventListener('change', (e) => {
            socket.emit('changeGameMode', { roomCode: currentRoom, mode: e.target.value });
        });
        
        document.getElementById('copyRoomBtn').onclick = () => {
            const url = `${window.location.origin}?room=${currentRoom}`;
            navigator.clipboard.writeText(url);
            showToast('تم نسخ رابط الغرفة');
        };
        
        document.querySelectorAll('.team-btn').forEach(btn => {
            btn.onclick = () => {
                const team = btn.dataset.team;
                socket.emit('chooseTeam', { roomCode: currentRoom, team });
            };
        });
        
        document.getElementById('readyBtn').onclick = () => {
            socket.emit('playerReady', { roomCode: currentRoom });
            document.getElementById('readyBtn').disabled = true;
            document.getElementById('readyBtn').innerText = '✓ تم التجهيز';
        };
    }
    
    function updatePlayersList(players) {
        const container = document.getElementById('playersList');
        container.innerHTML = players.map(player => `
            <div class="player-item">
                <div class="player-name">
                    ${player.isCreator ? '<span class="crown">👑</span>' : ''}
                    <span>${player.name}</span>
                    <span class="status-badge ${player.isReady ? 'status-ready' : 'status-waiting'}">
                        ${player.isReady ? 'جاهز' : 'غير جاهز'}
                    </span>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span class="player-team ${player.team === 'teamA' ? 'team-a-badge' : player.team === 'teamB' ? 'team-b-badge' : 'team-none'}">
                        ${player.team === 'teamA' ? '🛡️ النور' : player.team === 'teamB' ? '🌑 الظلام' : 'غير محدد'}
                    </span>
                    ${isCreator && player.id !== myPlayerId ? `
                        <button class="kick-btn" onclick="kickPlayer('${player.id}')">طرد</button>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }
    
    window.kickPlayer = (playerId) => {
        if (confirm('هل تريد طرد هذا اللاعب؟')) {
            socket.emit('kickPlayer', { roomCode: currentRoom, playerId });
        }
    };
    
    function showGameScreen() {
        lobbyScreen.classList.add('hidden');
        roomScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
    }
    
    function showQuestionScreen(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align: center;">
                <h3>📢 السؤال ${data.questionNumber}/${data.totalQuestions}</h3>
                <div class="question-text" style="font-size: 1.5rem; margin: 20px 0;">${data.question.q}</div>
                <div class="options-grid">
                    ${data.question.options.map((opt, idx) => `
                        <div class="option-card" onclick="submitAnswer(${idx})">${opt}</div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    window.submitAnswer = (answerIndex) => {
        socket.emit('submitAnswer', {
            roomCode: currentRoom,
            team: myTeam,
            answerIndex: answerIndex
        });
        document.getElementById('gameContent').innerHTML = '<div style="text-align: center;">⏳ جارٍ الانتظار...</div>';
    };
    
    function showDrawingScreen(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align: center;">
                <h3>🎨 ارسم الكلمة</h3>
                <p>عدد الحروف: ${data.wordLength} حروف</p>
                <canvas id="drawCanvas" width="400" height="300"></canvas>
                <div class="drawing-controls">
                    <button onclick="clearCanvas()">🧽 مسح</button>
                    <button onclick="submitDrawing()" class="btn-primary">📤 إرسال الرسم</button>
                </div>
            </div>
        `;
        
        const canvas = document.getElementById('drawCanvas');
        canvas.width = 400;
        canvas.height = 300;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'black';
        ctx.lineWidth = 3;
        
        let drawing = false;
        let lastX = 0, lastY = 0;
        
        function draw(x, y) {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            [lastX, lastY] = [x, y];
        }
        
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = (e.clientX - rect.left) * (canvas.width / rect.width);
            lastY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            draw(x, y);
        });
        
        canvas.addEventListener('mouseup', () => drawing = false);
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            drawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            lastX = (touch.clientX - rect.left) * (canvas.width / rect.width);
            lastY = (touch.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            draw(x, y);
        });
        
        canvas.addEventListener('touchend', () => drawing = false);
        
        window.clearCanvas = () => {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'black';
        };
        
        window.submitDrawing = () => {
            const drawingData = canvas.toDataURL();
            socket.emit('submitDrawing', { roomCode: currentRoom, team: myTeam, drawingData });
            document.getElementById('gameContent').innerHTML = '<div style="text-align: center;">⏳ جارٍ انتظار الفريق الآخر...</div>';
        };
    }
    
    function showGuessScreen(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align: center;">
                <h3>🔍 خمن الكلمة</h3>
                <p>عدد الحروف: ${data.wordLength}</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h4>رسم فريق ${myTeam === 'teamA' ? 'الظلام' : 'النور'}</h4>
                        <img src="${myTeam === 'teamA' ? data.drawingB : data.drawingA}" style="max-width: 100%; border-radius: 15px;">
                        <input type="text" id="guessInput" placeholder="اكتب تخمينك" style="margin-top: 10px;">
                        <button onclick="submitGuess()" class="btn-primary">خمن</button>
                    </div>
                </div>
            </div>
        `;
        
        window.submitGuess = () => {
            const guess = document.getElementById('guessInput').value.trim();
            if (guess) {
                socket.emit('submitGuess', { roomCode: currentRoom, team: myTeam, guess });
                document.getElementById('gameContent').innerHTML = '<div style="text-align: center;">⏳ جارٍ انتظار الفريق الآخر...</div>';
            }
        };
    }
    
    function showWeirdQuestionScreen(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align: center;">
                <h3>🤔 السؤال ${data.questionNumber}/${data.totalQuestions}</h3>
                <div class="question-text" style="font-size: 1.5rem; margin: 20px 0;">${data.question.q}</div>
                <div class="options-grid">
                    ${data.options.map(opt => `
                        <div class="option-card" onclick="submitWeirdAnswer('${opt}')">${opt}</div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    window.submitWeirdAnswer = (answer) => {
        socket.emit('submitWeirdAnswer', { roomCode: currentRoom, team: myTeam, answer });
        document.getElementById('gameContent').innerHTML = '<div style="text-align: center;">⏳ جارٍ الانتظار...</div>';
    };
    
    function showSpyMasterScreen(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align: center;">
                <h3>🕵️ كود نيمز - سباي ماستر</h3>
                <p>كلمتك السرية: <strong style="color: #FFD700; font-size: 1.5rem;">${data.word}</strong></p>
                <p>تلميحات مساعدة: ${data.clues.join(', ')}</p>
                <textarea id="spyClue" placeholder="اكتب تلميحاً لفريقك..." rows="3" style="width: 100%; margin: 10px 0;"></textarea>
                <button onclick="submitSpyClue()" class="btn-primary">إرسال التلميح</button>
            </div>
        `;
        
        window.submitSpyClue = () => {
            const clue = document.getElementById('spyClue').value.trim();
            if (clue) {
                socket.emit('submitSpyClue', { roomCode: currentRoom, team: myTeam, clue });
                document.getElementById('gameContent').innerHTML = '<div style="text-align: center;">⏳ جارٍ انتظار الفريق الآخر...</div>';
            }
        };
    }
    
    function showSpyGuessScreen(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align: center;">
                <h3>🔍 خمن الكلمة السرية</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h4>تلميح فريق ${myTeam === 'teamA' ? 'الظلام' : 'النور'}</h4>
                        <p style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px;">${myTeam === 'teamA' ? data.clueB : data.clueA}</p>
                        <input type="text" id="spyGuess" placeholder="خمن الكلمة" style="margin-top: 10px;">
                        <button onclick="submitSpyGuess()" class="btn-primary">خمن</button>
                    </div>
                </div>
            </div>
        `;
        
        window.submitSpyGuess = () => {
            const guess = document.getElementById('spyGuess').value.trim();
            if (guess) {
                socket.emit('submitSpyGuess', { roomCode: currentRoom, team: myTeam, guess });
                document.getElementById('gameContent').innerHTML = '<div style="text-align: center;">⏳ جارٍ انتظار الفريق الآخر...</div>';
            }
        };
    }
    
    function showRoundEnd(data) {
        const content = document.getElementById('gameContent');
        content.innerHTML = `
            <div style="text-align: center;">
                <h3>🎉 نهاية الجولة ${data.round} 🎉</h3>
                <p>نتيجة هذه الجولة:</p>
                <p>🛡️ فريق النور: ${data.scores.teamA} نقطة</p>
                <p>🌑 فريق الظلام: ${data.scores.teamB} نقطة</p>
                <p>النتيجة الإجمالية: ${data.totalScores.teamA} - ${data.totalScores.teamB}</p>
                <div class="spinner">⏳ جارٍ الانتقال للجولة التالية...</div>
            </div>
        `;
    }
    
    function showGameEnd(data) {
        const content = document.getElementById('gameContent');
        const winnerEmoji = data.winner === 'فريق النور' ? '🛡️' : data.winner === 'فريق الظلام' ? '🌑' : '🤝';
        content.innerHTML = `
            <div style="text-align: center;">
                <h2>🏆 نهاية اللعبة 🏆</h2>
                <div style="font-size: 3rem; margin: 20px;">${winnerEmoji}</div>
                <h3>${data.winner}</h3>
                <p>النتيجة النهائية:</p>
                <p>🛡️ فريق النور: ${data.finalScores.teamA} نقطة</p>
                <p>🌑 فريق الظلام: ${data.finalScores.teamB} نقطة</p>
                <button onclick="location.reload()" class="btn-primary" style="margin-top: 20px;">🔄 العودة للقائمة</button>
            </div>
        `;
    }
    
    // التحقق من وجود رابط غرفة
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
        document.getElementById('joinRoomCode').value = roomParam;
        document.getElementById('showJoinBtn').click();
    }
</script>
</body>
</html>
